[project]
name = "meshtui"
version = "0.1.0"
description = "MeshCore and Meshtastic operator suite, gateway, and web companion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "meshtastic>=2.5",
    "textual>=1.0",
    "pypubsub>=4.0.3",
    "cryptography>=50.0.1",
    "meshcore>=2.3.9.1",
    "qrcode>=8.2",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1,<3"]

[project.scripts]
meshtui = "meshtui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshtui"]
